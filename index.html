<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JurisFlow — Gestão para Advocacia</title>
<style>
:root{
  --accent:#5b5bd6; --accent-soft:#eeeefc; --accent-dark:#4747b8;
  --bg:#f6f7fb; --card:#ffffff; --border:#e5e7ee; --text:#2b2d3a; --muted:#7a7f93;
  --green:#2e9e6b; --red:#d64545; --amber:#d69a2e;
  --blue-pastel:#aecbeb; --gray-pastel:#c9ccd4; --yellow-pastel:#f2dfa0; --red-pastel:#e89a9a;
  --radius:12px; --shadow:0 1px 3px rgba(20,22,40,.07),0 4px 14px rgba(20,22,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field{margin-bottom:12px}
a{color:var(--accent)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd2dd;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:225px;min-width:225px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20}
#sidebar .brand{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--border)}
#sidebar .brand .logo-sq{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;overflow:hidden}
#sidebar .brand .logo-sq img{width:100%;height:100%;object-fit:cover}
#sidebar .brand b{font-size:16px;letter-spacing:-.02em}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 8px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;background:none;border-radius:9px;color:var(--muted);font-size:13.5px;font-weight:600;text-align:left;margin-bottom:2px}
.navitem svg{width:17px;height:17px;flex-shrink:0}
.navitem:hover{background:var(--bg);color:var(--text)}
.navitem.active{background:var(--accent-soft);color:var(--accent-dark)}
#sidebar .foot{padding:12px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
/* ---------- Voice Sidebar ---------- */
#voice-sidebar{border-top:1px solid var(--border);padding:4px 0;max-height:45%;overflow-y:auto}
.vs-section-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:5px 14px 3px}
.vs-room-item{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;margin:1px 5px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.vs-room-item:hover{background:var(--bg);color:var(--text)}
.vs-room-item.connected{background:var(--accent-soft);color:var(--accent-dark)}
.vs-room-emoji{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.vs-room-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.vs-room-count{font-size:10.5px;color:var(--muted);flex-shrink:0}
.vs-participants{padding:1px 12px 3px 28px}
.vs-participant{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:1px 0}
.vs-controls{display:flex;align-items:center;gap:3px;padding:5px 8px 5px;border-top:1px solid var(--border);margin-top:2px;background:#fafbff}
.vs-ctrl-room{flex:1;font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-ctrl-btn{width:26px;height:26px;border:none;border-radius:6px;background:var(--bg);font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.vs-ctrl-btn:hover{background:var(--border)}
.vs-ctrl-btn.off{background:#fee2e2}
.vs-offline{font-size:11px;color:var(--muted);padding:6px 12px 8px;text-align:center;line-height:1.55}
/* ---------- Week Kanban ---------- */
.week-board{display:grid;gap:8px;padding:12px}
.day-col{background:var(--bg);border-radius:10px;padding:8px;min-height:170px;display:flex;flex-direction:column;gap:6px;position:relative}
.day-col.dragover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.day-col.today{background:var(--accent-soft)}
.day-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 3px 2px;border-bottom:2px solid var(--border);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.day-col.today .day-lbl{color:var(--accent-dark);border-color:var(--accent)}
.day-num{font-size:13px;font-weight:600;color:var(--muted)}
.day-col.today .day-num{color:var(--accent-dark)}
/* ---------- Task Kanban ---------- */
.kanban-wrap{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;min-height:400px;align-items:flex-start}
.k-col{background:var(--bg);border-radius:12px;min-width:210px;flex:1;display:flex;flex-direction:column;max-height:calc(100vh - 200px)}
.k-col-h{padding:10px 12px 8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--border)}
.k-col-body{padding:8px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.k-col.dragover-col>.k-col-h{border-color:var(--accent)}
.k-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:12.5px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.k-card:hover{box-shadow:var(--shadow)}
.k-card.prazo{border-left-color:var(--red)}
.k-card.done{opacity:.5;text-decoration:line-through}
/* ---------- Task Detail ---------- */
.td-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.td-meta-item{flex:none}
.td-meta-item label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px}
.task-timer{text-align:center;background:var(--bg);border-radius:10px;padding:14px 10px;margin:10px 0}
.task-timer .tt-time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.task-timer .tt-total{font-size:11.5px;color:var(--muted);margin-top:2px}
.time-entry-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
/* ---------- Process Timeline ---------- */
.proc-timeline{display:flex;flex-direction:column;gap:0}
.proc-row{display:flex;gap:14px;align-items:flex-start}
.proc-main{flex:1;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.proc-main.suspenso{border:2px solid #f97316;box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.suspenso-tag{background:#f97316;color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:.07em;vertical-align:middle;margin-left:6px}
.proc-incidentals{display:flex;flex-direction:column;gap:8px;min-width:240px;max-width:260px}
.proc-incident-card{border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;position:relative}
.proc-incident-card::before{content:'';position:absolute;top:50%;left:-14px;width:14px;height:2px;background:var(--border)}
.proc-linear-section{display:flex;flex-direction:column;gap:0}
.proc-v-connector{width:2px;height:24px;background:linear-gradient(var(--border),var(--border));margin:0 24px}
.proc-linear-card{border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.proc-card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
.proc-card-h .sp{flex:1}
.proc-movs{max-height:260px;overflow-y:auto}
.pmov{padding:9px 14px;border-bottom:1px solid var(--border);position:relative;display:flex;gap:10px;align-items:flex-start}
.pmov:last-child{border-bottom:none}
.pmov-label{width:4px;flex-shrink:0;border-radius:2px;align-self:stretch;min-height:12px}
.pmov-body{flex:1;min-width:0}
.pmov-head{display:flex;align-items:baseline;gap:6px}
.pmov-tipo{font-size:12.5px;font-weight:700;flex:1}
.pmov-date{font-size:11px;color:var(--muted);flex-shrink:0}
.pmov-desc{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word}
.pmov-acts{display:flex;gap:3px;flex-shrink:0}
.pmov-docs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.doc-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--accent-soft);color:var(--accent-dark);border-radius:6px;font-size:11px;border:none;cursor:pointer;font-family:inherit}
/* ---------- Process Calendar ---------- */
.proc-cal{margin-top:4px}
/* ---------- Settings additions ---------- */
.mov-color-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.mov-color-row:last-child{border-bottom:none}
.status-tag-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.status-tag-row:last-child{border-bottom:none}
#main{flex:1;overflow-y:auto;position:relative}
#topbar{position:sticky;top:0;background:rgba(246,247,251,.92);backdrop-filter:blur(6px);z-index:15;display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--border)}
#topbar h1{font-size:19px;letter-spacing:-.02em;flex:1}
#searchbox{max-width:320px;position:relative}
#searchbox input{padding-left:32px;border-radius:20px}
#searchbox svg{position:absolute;left:11px;top:9px;width:15px;height:15px;color:var(--muted)}
#view{padding:22px 26px 60px}

/* ---------- Cards / genéricos ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px}
.card .card-h .sp{flex:1}
.card .card-b{padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:9px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:13px;color:var(--text)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.danger{color:var(--red)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.icon{padding:6px 8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
.chip .x{cursor:pointer;opacity:.75;font-weight:900}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:#fafbff}

/* ---------- Dashboard ---------- */
#cover{height:150px;border-radius:var(--radius);background:linear-gradient(120deg,#5b5bd6,#8b6fd8 60%,#b3a1e6);position:relative;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
#cover img.coverimg{width:100%;height:100%;object-fit:cover}
#cover .cover-inner{position:absolute;left:24px;bottom:16px;display:flex;align-items:center;gap:14px}
#cover .office-logo{width:64px;height:64px;border-radius:14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:var(--accent);overflow:hidden}
#cover .office-logo img{width:100%;height:100%;object-fit:contain}
#cover .office-name{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
#cover .office-name b{font-size:20px;display:block}
#cover .office-name span{font-size:12.5px;opacity:.9}
#cover .cover-edit{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.85);border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.dash-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.task-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:7px 8px;font-size:12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.task-card:active{cursor:grabbing}
.task-card.done{opacity:.55;text-decoration:line-through}
.task-card.prazo{border-left-color:var(--red)}
.task-card .t-meta{font-size:10.5px;color:var(--muted);margin-top:3px}
.task-card .t-check{float:right;margin-left:5px}
.prazo-item{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer}
.prazo-item:last-child{border-bottom:none}
.prazo-item .p-days{min-width:52px;text-align:center;border-radius:8px;padding:5px 3px;font-weight:800;font-size:12px}
.prazo-item .p-days small{display:block;font-weight:600;font-size:9.5px}
.prazo-item .p-tit{font-size:12.5px;font-weight:600;flex:1}
.prazo-item .p-sub{font-size:11px;color:var(--muted)}

/* mini calendário */
.mini-cal{width:100%}
.mini-cal .mc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:13px}
.mini-cal .mc-head button{border:none;background:none;font-size:15px;color:var(--muted);padding:2px 8px}
.mini-cal table{width:100%;border-collapse:collapse;text-align:center}
.mini-cal th{font-size:10px;color:var(--muted);padding:3px 0;font-weight:700}
.mini-cal td{font-size:12px;padding:0}
.mini-cal td span{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;position:relative}
.mini-cal td span:hover{background:var(--bg)}
.mini-cal td span.today{background:var(--accent);color:#fff;font-weight:700}
.mini-cal td span.hastask::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.mini-cal td span.today.hastask::after{background:#fff}

/* pomodoro */
#pomo-wrap{text-align:center}
#pomo-visual{height:150px;display:flex;align-items:center;justify-content:center;margin:4px 0}
#pomo-time{font-size:30px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#pomo-phase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#pomo-phase.work{color:var(--red)}
#pomo-phase.break{color:var(--green)}
.pomo-btns{display:flex;gap:8px;justify-content:center;margin-top:8px}
.skin-picker{display:flex;gap:6px;justify-content:center;margin-top:10px}
.skin-picker button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:4px 9px;font-size:15px}
.skin-picker button.active{border-color:var(--accent);background:var(--accent-soft)}

/* barra do dia */
#daybar-wrap{margin-top:14px}
#daybar{height:16px;border-radius:9px;overflow:hidden;display:flex;position:relative;border:1px solid var(--border)}
#daybar .seg{height:100%}
#daybar-marker{position:absolute;top:-4px;width:2.5px;height:24px;background:var(--text);border-radius:2px;box-shadow:0 0 4px rgba(0,0,0,.4)}
#daybar-info{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;background:rgba(25,27,45,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px}
#modal-root.open{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:100%;max-width:560px;animation:pop .18s ease}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal .m-head{display:flex;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.modal .m-head .sp{flex:1}
.modal .m-head .close{border:none;background:none;font-size:20px;color:var(--muted);padding:2px 6px}
.modal .m-body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal .m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}

/* ---------- Processos / detalhe ---------- */
.detail-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.detail-head .dh-main{flex:1}
.detail-head h2{font-size:19px;letter-spacing:-.02em;margin-bottom:3px}
.back{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:0;margin-bottom:10px;display:inline-flex;align-items:center;gap:5px}
.mov{border-left:3px solid var(--accent);padding:8px 12px;margin:0 0 10px 6px;background:#fff;border-radius:0 9px 9px 0;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.mov .mov-h{display:flex;gap:8px;align-items:baseline}
.mov .mov-h b{font-size:13.5px}
.mov .mov-h .mov-date{font-size:11.5px;color:var(--muted);font-weight:600}
.mov .mov-desc{font-size:13px;color:#4a4e61;margin-top:3px;white-space:pre-wrap}
.mov .mov-acts{float:right}
.desdobra{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
.desdobra>.d-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);font-weight:700;font-size:13px;cursor:pointer}
.desdobra>.d-b{padding:12px 14px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.folder{border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.folder .f-h{display:flex;align-items:center;gap:8px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;background:var(--bg);border-radius:10px 10px 0 0}
.folder .f-b{padding:8px 13px}
.file-item{display:flex;align-items:center;gap:9px;padding:6px 4px;font-size:13px;border-bottom:1px dashed var(--border)}
.file-item:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 14px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent-dark);border-bottom-color:var(--accent)}
.hist-item{padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:9px}
.hist-item b{font-size:13.5px}
.hist-item .h-date{font-size:11.5px;color:var(--muted);float:right}
.hist-item p{font-size:13px;color:#4a4e61;margin-top:4px;white-space:pre-wrap}

/* ---------- Agenda mensal ---------- */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border)}
.month-grid .mg-h{padding:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg);text-align:center}
.mg-cell{min-height:105px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px;background:#fff}
.mg-cell.other{background:#fafafc}
.mg-cell .n{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.mg-cell.todaycell .n{color:#fff;background:var(--accent);display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center}
.mg-task{font-size:11px;background:var(--accent-soft);color:var(--accent-dark);border-radius:5px;padding:2px 6px;margin-bottom:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mg-task.prazo{background:#fbe4e4;color:#a83232}
.mg-task.done{opacity:.5;text-decoration:line-through}

/* ---------- Salas de voz ---------- */
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;border:1.5px solid transparent;transition:background .15s}
.status-pill.online{background:#def0e6;color:#1a7a4a;border-color:#a3d9bc}
.status-pill.busy{background:#fbe4e4;color:#a83232;border-color:#f0b8b8}
.status-pill.lunch{background:#faf0d7;color:#8a620a;border-color:#e8d090}
.status-pill.away{background:#f0f0f4;color:#7a7f93;border-color:#d0d3de}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:4px}
.room-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.room-card .rc-top{padding:20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border)}
.room-card .rc-emoji{font-size:32px;line-height:1}
.room-card .rc-info{flex:1}
.room-card .rc-info b{font-size:16px;display:block}
.room-card .rc-info small{color:var(--muted);font-size:12px}
.room-card .rc-body{padding:12px 16px;flex:1;min-height:70px}
.room-card .rc-foot{padding:10px 16px;display:flex;gap:8px;border-top:1px solid var(--border);background:var(--bg)}
.status-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
.jitsi-note{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:12.5px;color:var(--accent-dark);margin-bottom:18px}

/* ---------- Impressão ---------- */
#print-root{display:none}
@media print{
  body>#app,#modal-root{display:none!important}
  #print-root{display:block!important;padding:30px;font-size:12.5px}
  #print-root .p-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #5b5bd6;padding-bottom:14px;margin-bottom:18px}
  #print-root .p-head img{max-height:60px;max-width:170px;object-fit:contain}
  #print-root h1{font-size:19px}
  #print-root h2{font-size:15px;margin:16px 0 8px;border-bottom:1px solid #ccc;padding-bottom:4px}
  #print-root table{width:100%;border-collapse:collapse;margin-bottom:10px}
  #print-root td,#print-root th{border:1px solid #ddd;padding:6px 9px;text-align:left;font-size:12px}
  #print-root .pmov{border-left:3px solid #5b5bd6;padding:6px 10px;margin-bottom:8px;page-break-inside:avoid}
  #print-root .pmov .d{color:#666;font-size:11px}
  #print-root .pfoot{margin-top:26px;font-size:10.5px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:8px}
}

@media (max-width:1100px){.dash-grid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
@media (max-width:800px){#sidebar{position:fixed;left:-230px;height:100%;transition:left .2s}#sidebar.open{left:0}.week-board{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}

/* ---------- Toast ---------- */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{background:#2b2d3a;color:#fff;padding:11px 17px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:toastin .2s ease;pointer-events:auto;max-width:360px}
.toast.success{background:var(--green)}.toast.warn{background:var(--amber)}.toast.error{background:var(--red)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.spin{display:inline-block;animation:spin .8s linear infinite;font-style:normal}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<script>
'use strict';
if(typeof structuredClone==='undefined'){window.structuredClone=o=>JSON.parse(JSON.stringify(o));}
/* =====================================================
   JurisFlow — sistema de gestão para advocacia
   Arquivo único. Dados no navegador (localStorage + IndexedDB p/ arquivos)
   ===================================================== */

/* ---------- Persistência ---------- */
const DB_KEY='jurisflow_v1';
const DEFAULT_DATA={
  settings:{
    officeName:'Meu Escritório', officeSub:'Advocacia', logo:null, cover:null,
    userName:'', userEmail:'',
    workStart:'08:00', lunchStart:'12:00', lunchEnd:'13:00', workEnd:'17:00',
    pomoWork:25, pomoBreak:5, pomoSkin:'tomato',
    showWeekend:false,
    taskStatuses:['A Fazer','Em Andamento','Aguardando','Concluído'],
    movColors:{'Sentença':'#e53935','Trânsito em Julgado':'#5b5bd6','Liminar':'#f97316','Acordo':'#2e9e6b'}
  },
  clients:[], processes:[], tasks:[],
  tags:[
    {id:'tg1',name:'Tributário',color:'#5b5bd6'},
    {id:'tg2',name:'Trabalhista',color:'#2e9e6b'},
    {id:'tg3',name:'Cível',color:'#d69a2e'},
    {id:'tg4',name:'Empresarial',color:'#d64545'}
  ],
  rooms:[
    {id:'r1',name:'Geral',emoji:'💬',desc:'Sala principal do escritório'},
    {id:'r2',name:'Tributário',emoji:'🏛️',desc:'Setor tributário'},
    {id:'r3',name:'Trabalhista',emoji:'⚖️',desc:'Setor trabalhista'},
    {id:'r4',name:'Cível',emoji:'📋',desc:'Setor cível'},
  ],
  myStatus:{code:'online',label:'Online',since:null},
  movTypes:['Distribuição','Citação','Contestação','Réplica','Despacho','Decisão','Liminar','Sentença','Recurso','Intimação','Publicação','Audiência','Trânsito em Julgado','Penhora','Acordo'],
  procTypes:['Ação Ordinária','Ação Anulatória','Ação de Cobrança','Ação de Repetição de Indébito','Mandado de Segurança','Execução Fiscal','Reclamação Trabalhista','Cumprimento de Sentença']
};
let DATA=load();
function load(){
  try{const raw=localStorage.getItem(DB_KEY);if(!raw)return structuredClone(DEFAULT_DATA);
    const d=JSON.parse(raw);
    for(const k in DEFAULT_DATA){if(d[k]===undefined)d[k]=structuredClone(DEFAULT_DATA[k]);}
    for(const k in DEFAULT_DATA.settings){if(d.settings[k]===undefined)d.settings[k]=DEFAULT_DATA.settings[k];}
    return d;
  }catch(e){console.error(e);return structuredClone(DEFAULT_DATA);}
}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(DATA));}catch(e){alert('Erro ao salvar. O armazenamento pode estar cheio. Faça um backup e remova arquivos grandes.');}}
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const API_BASE='http://localhost:3000';

/* ── Estado das Salas de Voz (WebRTC) ─────────────────────────────────── */
let voiceSocket=null, voicePeers={}, localStream=null, connectedRoomId=null, micOn=true, audioOn=true, roomsInfo={};
const STUN_SERVERS=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];

/* IndexedDB para arquivos de clientes */
let idb=null;
const idbReady=new Promise(res=>{
  const rq=indexedDB.open('jurisflow_files',1);
  rq.onupgradeneeded=e=>{e.target.result.createObjectStore('files',{keyPath:'id'});};
  rq.onsuccess=e=>{idb=e.target.result;res();};
  rq.onerror=()=>res();
});
function fileAdd(rec){return new Promise((res,rej)=>{const tx=idb.transaction('files','readwrite');tx.objectStore('files').put(rec);tx.oncomplete=res;tx.onerror=rej;});}
function fileGet(id){return new Promise(res=>{const rq=idb.transaction('files').objectStore('files').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);});}
function fileDel(id){return new Promise(res=>{const tx=idb.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=res;});}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WEEKDAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WEEKDAYS_FULL=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'];
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function todayStr(){const d=new Date();return dstr(d);}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function fmtD(s){if(!s)return'';const[a,b,c]=s.split('-');return c+'/'+b+'/'+a;}
function daysUntil(s){const t=new Date();t.setHours(0,0,0,0);return Math.round((parseD(s)-t)/86400000);}
function minOfDay(hhmm){const[h,m]=hhmm.split(':').map(Number);return h*60+m;}
function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function readImg(file,maxW,cb){
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,maxW/img.width);const cv=document.createElement('canvas');
    cv.width=img.width*sc;cv.height=img.height*sc;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/jpeg',0.85));
  };img.src=rd.result;};
  rd.readAsDataURL(file);
}
function maskDoc(v){
  v=v.replace(/\D/g,'').slice(0,14);
  if(v.length<=11)return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  return v.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
}
function getClient(id){return DATA.clients.find(c=>c.id===id);}
function getProc(id){return DATA.processes.find(p=>p.id===id);}
function getTag(id){return DATA.tags.find(t=>t.id===id);}
function clientLabel(c){return c? (c.fantasia||c.nome) : '';}
function confirmDel(msg){return confirm(msg||'Tem certeza que deseja excluir?');}

/* ---------- Navegação ---------- */
const NAV=[
  {id:'dash',label:'Dashboard',icon:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'},
  {id:'clients',label:'Clientes',icon:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.7 3.4-6 6.5-6s5.8 2.3 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.6.3 4.6 2 5.3 5"/>'},
  {id:'procs',label:'Processos',icon:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>'},
  {id:'tasks',label:'Tarefas',icon:'<rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="m8 12.5 2.6 2.6L16.5 9"/>'},
  {id:'agenda',label:'Agenda',icon:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'},
  {id:'rooms',label:'Salas de voz',icon:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>'},
  {id:'settings',label:'Configurações',icon:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9 19 19M19 5l-2.1 2.1M7.1 16.9 5 19"/>'}
];
let route={page:'dash',id:null,sub:null};
function nav(page,id,sub){route={page,id:id||null,sub:sub||null};render();}
function renderNav(){
  $('#nav').innerHTML=NAV.map(n=>`<button class="navitem${route.page===n.id||(n.id==='clients'&&route.page==='client')||(n.id==='procs'&&route.page==='proc')?' active':''}" onclick="nav('${n.id}')">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg>${n.label}</button>`).join('');
}
function render(){
  renderNav();renderBrand();renderVoiceSidebar();
  const v=$('#view');
  const titles={dash:'Dashboard',clients:'Clientes',procs:'Processos e Casos',tasks:'Tarefas',agenda:'Agenda',rooms:'Salas de voz',settings:'Configurações',client:'Cliente',proc:'Processo'};
  $('#page-title').textContent=titles[route.page]||'';
  if(route.page==='dash')renderDash(v);
  else if(route.page==='clients')renderClients(v);
  else if(route.page==='client')renderClientDetail(v,route.id);
  else if(route.page==='procs')renderProcs(v);
  else if(route.page==='proc')renderProcDetail(v,route.id);
  else if(route.page==='tasks')renderTasks(v);
  else if(route.page==='agenda')renderAgenda(v);
  else if(route.page==='rooms')renderRooms(v);
  else if(route.page==='settings')renderSettings(v);
}
function renderBrand(){
  const s=DATA.settings;
  $('#brand-name').textContent=s.officeName||'JurisFlow';
  $('#brand-logo').innerHTML=s.logo?`<img src="${s.logo}">`:esc((s.officeName||'J')[0].toUpperCase());
}
/* =====================================================
   DASHBOARD
   ===================================================== */
let weekOffset=0, miniCalDate=new Date();
function startOfWeek(d){const x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x;} // Sunday=0
function fmtDuration(secs){secs=Math.max(0,Math.floor(secs||0));const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),s=secs%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function toggleWeekend(v){DATA.settings.showWeekend=v;save();renderWeekBoard();}

function renderDash(v){

  v.innerHTML=`
  <div id="cover">

    <div class="cover-inner">

    <button class="cover-edit" onclick="nav('settings')">✎ Editar capa</button>

          <div class="card-h">📋 Esta semana</div>
          <div class="card-b" id="week-tasks-box" style="max-height:210px;overflow-y:auto;padding:4px 10px"></div>
        </div>
        <div class="card">
          <div class="card-h">📌 Sem data<span class="sp"></span><button class="btn small primary" onclick="taskForm()">+ Tarefa</button></div>

      </div>
      <div class="card">
        <div class="card-b" id="pomo-card"></div>
      </div>
      <div class="card">
        <div class="card-b" id="daybar-card"></div>
      </div>
    </div>
  </div>`;
  renderWeekBoard();renderWeekTasks();renderNoDate();renderPrazos();renderMiniCal();mountPomodoro();mountDaybar();
}

/* --- quadro semanal kanban --- */
function renderWeekBoard(){
  const showWE=DATA.settings.showWeekend;
  // Sun=0 → show days 1-5 (Mon-Fri) by default; all 7 if showWeekend
  const daysIdx=showWE?[0,1,2,3,4,5,6]:[1,2,3,4,5];
  const board=$('#week-board');if(!board)return;
  board.style.gridTemplateColumns=`repeat(${daysIdx.length},1fr)`;
  const startSun=startOfWeek(new Date());startSun.setDate(startSun.getDate()+weekOffset*7);
  // week label: Mon–Fri
  const mon=new Date(startSun);mon.setDate(mon.getDate()+1);
  const fri=new Date(startSun);fri.setDate(fri.getDate()+(showWE?6:5));
  const wl=$('#week-label');if(wl)wl.textContent=`${mon.getDate()}/${mon.getMonth()+1} – ${fri.getDate()}/${fri.getMonth()+1}`;
  let html='';
  for(const di of daysIdx){
    const d=new Date(startSun);d.setDate(d.getDate()+di);
    const ds=dstr(d);const isToday=ds===todayStr();
    const tasks=DATA.tasks.filter(t=>t.date===ds&&!t.done).sort((a,b)=>(a.isPrazo?-1:0)-(b.isPrazo?-1:0));
    const done=DATA.tasks.filter(t=>t.date===ds&&t.done);
    html+=`<div class="day-col${isToday?' today':''}" data-date="${ds}" ondragover="dayDragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="dayDrop(event)">
      <div class="day-lbl"><b>${WEEKDAYS_FULL[di]}</b><span class="day-num">${d.getDate()}/${d.getMonth()+1}</span></div>
      ${tasks.map(taskCardHtml).join('')}
      ${done.length?`<div style="font-size:10px;color:var(--muted);margin-top:4px">${done.length} concluída(s)</div>`:''}
      <button class="btn small" style="border-style:dashed;color:var(--muted);margin-top:auto;font-size:11px" onclick="taskForm(null,'${ds}')">+ tarefa</button>
    </div>`;
  }
  board.innerHTML=html;
}
function renderWeekTasks(){
  const box=$('#week-tasks-box');if(!box)return;
  const startSun=startOfWeek(new Date());startSun.setDate(startSun.getDate()+weekOffset*7);
  const startStr=dstr(new Date(startSun.getTime()+86400000)); // Mon
  const endSun=new Date(startSun);endSun.setDate(endSun.getDate()+7);
  const endStr=dstr(endSun);
  const tasks=DATA.tasks.filter(t=>t.date&&t.date>=startStr&&t.date<=endStr&&!t.done)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!tasks.length){box.innerHTML='<div class="empty">Sem tarefas esta semana.</div>';return;}
  box.innerHTML=tasks.map(t=>`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openTaskDetail('${t.id}')">
    <input type="checkbox" style="width:auto;flex-shrink:0" onclick="event.stopPropagation();toggleTask('${t.id}')" ${t.done?'checked':''}>

function taskCardHtml(t){

function dayDragOver(e){e.preventDefault();e.currentTarget.classList.add('dragover');}
function dayDrop(e){

/* ── Timer global ─────────────────────────────────────────────────────── */
let activeTimer={taskId:null,startMs:null,elapsed:0,interval:null};
function timerStop(taskId){
  if(activeTimer.interval){clearInterval(activeTimer.interval);activeTimer.interval=null;}
  if(activeTimer.startMs){activeTimer.elapsed+=(Date.now()-activeTimer.startMs)/1000;activeTimer.startMs=null;}
}
function timerReset(){timerStop();activeTimer={taskId:null,startMs:null,elapsed:0,interval:null};}
function timerCurrentSecs(){return Math.floor(activeTimer.elapsed+((activeTimer.startMs)?(Date.now()-activeTimer.startMs)/1000:0));}

/* ── Detalhe da tarefa ───────────────────────────────────────────────── */
function openTaskDetail(id){
  const t=DATA.tasks.find(x=>x.id===id);if(!t)return;
  const proc=t.processId?getProc(t.processId):null;
  const cli=t.clientId?getClient(t.clientId):(proc?getClient(proc.clientId):null);
  const entries=t.timeEntries||[];
  const totalSecs=entries.reduce((s,e)=>s+(e.dur||0),0);
  const statuses=(DATA.settings.taskStatuses||['A Fazer','Em Andamento','Aguardando','Concluído']);
  const curStatus=t.status||statuses[0];
  const isRunning=activeTimer.taskId===id&&activeTimer.interval;
  openModal(esc(t.title),`
    <div class="td-meta">
      <div class="td-meta-item">
        <label>Status</label>
        <select id="td-status" style="padding:4px 8px;font-size:12px" onchange="saveTaskField('${id}','status',this.value)">
          ${statuses.map(s=>`<option ${curStatus===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
      </div>
      ${t.date?`<div class="td-meta-item"><label>Data</label><b style="font-size:13px">${fmtD(t.date)}</b>${t.isPrazo?' <span style="color:var(--red);font-size:10px;font-weight:800">PRAZO</span>':''}</div>`:''}
      ${cli?`<div class="td-meta-item"><label>Cliente</label><span style="font-size:12.5px">${esc(clientLabel(cli))}</span></div>`:''}
      ${proc?`<div class="td-meta-item"><label>Processo</label><span style="font-size:12px">${esc(proc.numero||proc.tipo)}</span></div>`:''}
    </div>
    ${t.desc?`<div style="background:var(--bg);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;white-space:pre-wrap;line-height:1.55">${esc(t.desc)}</div>`:''}
    <div class="task-timer">
      <div id="td-timer" class="tt-time">${fmtDuration(isRunning?timerCurrentSecs():activeTimer.taskId===id?activeTimer.elapsed:0)}</div>
      <div class="tt-total">Total já registrado: <b>${fmtDuration(totalSecs)}</b></div>
      <div class="pomo-btns" style="margin-top:10px;gap:8px">
        <button class="btn${isRunning?' danger':' primary'}" id="td-timer-btn" onclick="timerToggleUI('${id}')">${isRunning?'⏸ Pausar':'▶ Iniciar'}</button>
        <button class="btn" onclick="timerSave('${id}')">💾 Salvar tempo</button>
      </div>
    </div>
    ${entries.length?`<div style="margin-top:4px">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px">Sessões registradas</div>
      ${entries.slice().reverse().map(e=>`<div class="time-entry-row"><span>${fmtD(e.date||'')}</span><span>⏱ <b>${fmtDuration(e.dur)}</b></span></div>`).join('')}
    </div>`:''}
  `,`
    <button class="btn" onclick="taskForm('${id}')">✎ Editar</button>
    <span style="flex:1"></span>
    <button class="btn${t.done?' primary':''}" onclick="toggleTask('${id}');openTaskDetail('${id}')">${t.done?'↩ Reabrir':'✓ Concluir'}</button>
    <button class="btn" onclick="closeModal()">Fechar</button>
  `);
  if(isRunning)_timerTick(id);
}
function timerToggleUI(id){
  if(activeTimer.taskId!==id){timerReset();activeTimer.taskId=id;}
  if(activeTimer.interval){
    timerStop(id);
    const btn=$('#td-timer-btn');if(btn){btn.textContent='▶ Iniciar';btn.className='btn primary';}
  } else {
    activeTimer.startMs=Date.now();
    activeTimer.interval=setInterval(()=>{
      const el=$('#td-timer');if(el)el.textContent=fmtDuration(timerCurrentSecs());
    },1000);
    const btn=$('#td-timer-btn');if(btn){btn.textContent='⏸ Pausar';btn.className='btn danger';}
  }
}
function _timerTick(id){
  activeTimer.interval=setInterval(()=>{
    const el=$('#td-timer');if(!el){clearInterval(activeTimer.interval);activeTimer.interval=null;return;}
    el.textContent=fmtDuration(timerCurrentSecs());
  },1000);
}
function timerSave(id){
  const secs=timerCurrentSecs();
  if(secs<5){showToast('Nenhum tempo para salvar (menos de 5 segundos).','warn');return;}
  timerStop(id);
  const t=DATA.tasks.find(x=>x.id===id);if(!t)return;
  if(!t.timeEntries)t.timeEntries=[];
  const entry={id:uid(),date:todayStr(),dur:Math.floor(secs)};
  t.timeEntries.push(entry);
  activeTimer.elapsed=0;activeTimer.taskId=null;
  // Registra no cliente se vinculado
  const proc=t.processId?getProc(t.processId):null;
  const cliId=t.clientId||(proc?.clientId)||null;
  if(cliId){
    const cli=getClient(cliId);if(cli){
      if(!cli.timeLog)cli.timeLog=[];
      cli.timeLog.push({id:uid(),date:todayStr(),taskId:id,taskTitle:t.title,dur:entry.dur});
    }
  }
  save();showToast(`⏱ ${fmtDuration(entry.dur)} salvo na tarefa!`,'success');
  openTaskDetail(id);
}
function saveTaskField(id,field,value){
  const t=DATA.tasks.find(x=>x.id===id);if(t){t[field]=value;save();}
}
function renderNoDate(){
  const box=$('#nodate-tasks');if(!box)return;
  const ts=DATA.tasks.filter(t=>!t.date&&!t.done);

function renderMiniCal(){
  const box=$('#mini-cal');if(!box)return;
  const y=miniCalDate.getFullYear(),m=miniCalDate.getMonth();
  const first=new Date(y,m,1);const startDow=(first.getDay());
  const dim=new Date(y,m+1,0).getDate();
  const taskDates=new Set(DATA.tasks.filter(t=>t.date&&!t.done).map(t=>t.date));

      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      rows+=`<td><span class="${ds===todayStr()?'today ':''}${taskDates.has(ds)?'hastask':''}" onclick="nav('agenda')">${day}</span></td>`;
      day++;
    }
    rows+='</tr>';
  }
  box.innerHTML=`<div class="mc-head">
    <button onclick="miniCalDate=new Date(${y},${m-1},1);renderMiniCal()">‹</button>
    <span>${MONTHS[m]} ${y}</span>

}

/* =====================================================
   POMODORO (skins: tomate, timer, árvore)
   ===================================================== */
const pomo={phase:'work',remaining:0,total:0,running:false,timer:null};
function pomoInit(){
  if(!pomo.running){pomo.phase='work';pomo.total=DATA.settings.pomoWork*60;pomo.remaining=pomo.total;}
}
function mountPomodoro(){
  const card=$('#pomo-card');if(!card)return;
  pomoInit();
  const s=DATA.settings;
  card.innerHTML=`<div id="pomo-wrap">
    <div id="pomo-phase" class="${pomo.phase}">${pomo.phase==='work'?'🍅 Foco':'☕ Pausa'}</div>
    <div id="pomo-visual"></div>
    <div id="pomo-time">--:--</div>
    <div class="pomo-btns">
      <button class="btn primary" id="pomo-toggle" onclick="pomoToggle()">${pomo.running?'Pausar':'Iniciar'}</button>
      <button class="btn" onclick="pomoReset()">↺</button>
    </div>
    <div class="skin-picker">
      <button title="Tomate" class="${s.pomoSkin==='tomato'?'active':''}" onclick="setSkin('tomato')">🍅</button>
      <button title="Temporizador" class="${s.pomoSkin==='timer'?'active':''}" onclick="setSkin('timer')">⏱️</button>
      <button title="Árvore" class="${s.pomoSkin==='tree'?'active':''}" onclick="setSkin('tree')">🌳</button>
    </div>
    <div class="muted" style="font-size:11px;margin-top:7px">${s.pomoWork} min foco · ${s.pomoBreak} min pausa — ajuste em Configurações</div>
  </div>`;
  pomoDraw();
}
function setSkin(k){DATA.settings.pomoSkin=k;save();mountPomodoro();}
function pomoToggle(){
  if(pomo.running){clearInterval(pomo.timer);pomo.running=false;}
  else{
    if(pomo.remaining<=0)pomoSetPhase(pomo.phase);
    pomo.running=true;
    pomo.timer=setInterval(()=>{
      pomo.remaining--;
      if(pomo.remaining<=0){
        try{pomoBeep();}catch(e){}
        pomoSetPhase(pomo.phase==='work'?'break':'work');
      }
      pomoDraw();
    },1000);
  }
  const b=$('#pomo-toggle');if(b)b.textContent=pomo.running?'Pausar':'Iniciar';
}
function pomoSetPhase(ph){
  pomo.phase=ph;
  pomo.total=(ph==='work'?DATA.settings.pomoWork:DATA.settings.pomoBreak)*60;
  pomo.remaining=pomo.total;
  const el=$('#pomo-phase');if(el){el.className=ph;el.innerHTML=ph==='work'?'🍅 Foco':'☕ Pausa';}
}
function pomoReset(){clearInterval(pomo.timer);pomo.running=false;pomoSetPhase('work');pomoDraw();const b=$('#pomo-toggle');if(b)b.textContent='Iniciar';}
function pomoBeep(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.15;
  o.start();o.stop(ctx.currentTime+.6);
}
function pomoDraw(){
  const tEl=$('#pomo-time'),vEl=$('#pomo-visual');if(!tEl||!vEl)return;
  const m=Math.floor(Math.max(0,pomo.remaining)/60),s=Math.max(0,pomo.remaining)%60;
  tEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const prog=pomo.total?1-(pomo.remaining/pomo.total):0; // 0→1
  const skin=DATA.settings.pomoSkin;
  if(skin==='tomato')vEl.innerHTML=skinTomato(prog);
  else if(skin==='timer')vEl.innerHTML=skinTimer(prog);
  else vEl.innerHTML=skinTree(prog);
}
function skinTomato(p){
  const fillY=95-p*72; // enche de baixo p/ cima
  return `<svg width="120" height="130" viewBox="0 0 120 130">
    <defs><clipPath id="tclip"><path d="M60 28C33 28 16 48 16 74c0 26 20 44 44 44s44-18 44-44c0-26-17-46-44-46z"/></clipPath></defs>
    <path d="M60 28C33 28 16 48 16 74c0 26 20 44 44 44s44-18 44-44c0-26-17-46-44-46z" fill="#f3d6d6"/>
    <rect x="10" y="${fillY}" width="100" height="${125-fillY}" fill="#e2504c" clip-path="url(#tclip)"/>
    <path d="M60 28C33 28 16 48 16 74c0 26 20 44 44 44s44-18 44-44c0-26-17-46-44-46z" fill="none" stroke="#b83c38" stroke-width="3"/>
    <path d="M60 30c-2-8-1-14 0-18" stroke="#4c8c3f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M60 26c-8-6-16-6-24-3 6 6 14 8 24 3zm0 0c8-6 16-6 24-3-6 6-14 8-24 3z" fill="#5da24e"/>
    <ellipse cx="42" cy="62" rx="7" ry="10" fill="rgba(255,255,255,.35)" transform="rotate(-18 42 62)"/>
  </svg>`;
}
function skinTimer(p){
  const R=52,C=2*Math.PI*R;
  const col=pomo.phase==='work'?'#e2504c':'#2e9e6b';
  return `<svg width="130" height="130" viewBox="0 0 130 130">
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="#eceef4" stroke-width="10"/>
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .5s linear"/>
    <circle cx="65" cy="65" r="40" fill="#fff" stroke="#eceef4"/>
    <text x="65" y="72" text-anchor="middle" font-size="26">${pomo.phase==='work'?'⏱️':'☕'}</text>
  </svg>`;
}
function skinTree(p){
  const trunkH=18+p*30, crownR=6+p*30;
  const stage=p<0.15?0:p<0.5?1:2;
  return `<svg width="130" height="140" viewBox="0 0 130 140">
    <ellipse cx="65" cy="126" rx="42" ry="9" fill="#d9c9a8"/>
    <rect x="61" y="${124-trunkH}" width="8" height="${trunkH}" rx="3" fill="#8a5a33"/>
    ${stage===0?`<circle cx="65" cy="${120-trunkH}" r="7" fill="#7cbf6b"/>`:''}
    ${stage>=1?`<circle cx="65" cy="${118-trunkH}" r="${crownR}" fill="#5da24e"/>
      <circle cx="${65-crownR*.7}" cy="${124-trunkH}" r="${crownR*.72}" fill="#6fb35e"/>
      <circle cx="${65+crownR*.7}" cy="${124-trunkH}" r="${crownR*.72}" fill="#6fb35e"/>`:''}
    ${stage===2?`<circle cx="${60-crownR*.3}" cy="${112-trunkH}" r="3.4" fill="#e2504c"/>
      <circle cx="${72+crownR*.2}" cy="${118-trunkH}" r="3.4" fill="#e2504c"/>
      <circle cx="65" cy="${106-trunkH}" r="3.4" fill="#e2504c"/>`:''}
  </svg>`;
}

/* =====================================================
   BARRA DE PROGRESSO DO DIA
   ===================================================== */
let daybarTimer=null;
function mountDaybar(){
  const card=$('#daybar-card');if(!card)return;
  card.innerHTML=`<div style="font-weight:700;font-size:13px;margin-bottom:4px">Seu dia</div>
    <div id="daybar-wrap"><div id="daybar"></div><div id="daybar-info"></div></div>`;
  drawDaybar();
  clearInterval(daybarTimer);daybarTimer=setInterval(drawDaybar,30000);
}
function drawDaybar(){
  const bar=$('#daybar');if(!bar)return;
  const s=DATA.settings;
  const st=minOfDay(s.workStart),le=minOfDay(s.lunchEnd),ls=minOfDay(s.lunchStart),en=minOfDay(s.workEnd);
  const total=en-st;if(total<=0)return;
  const pct=x=>((x/total)*100).toFixed(2)+'%';
  const segs=[
    {w:ls-st,c:'var(--blue-pastel)'},        // manhã
    {w:le-ls,c:'var(--gray-pastel)'},        // almoço
    {w:(en-15)-le,c:'var(--yellow-pastel)'}, // tarde
    {w:15,c:'var(--red-pastel)'}             // últimos 15 min
  ];
  bar.innerHTML=segs.map(g=>`<div class="seg" style="width:${pct(g.w)};background:${g.c}"></div>`).join('');
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  const clamped=Math.min(Math.max(nowMin,st),en);
  bar.innerHTML+=`<div id="daybar-marker" style="left:calc(${pct(clamped-st)} - 1px)"></div>`;
  const left=en-nowMin;
  let msg;
  if(nowMin<st)msg='O expediente ainda não começou';
  else if(nowMin>=en)msg='Expediente encerrado — bom descanso! 🌙';
  else if(left<=15)msg='⚠️ Últimos '+left+' min do dia!';
  else if(nowMin>=ls&&nowMin<le)msg='🍽️ Horário de almoço';
  else msg=Math.floor(left/60)+'h'+String(left%60).padStart(2,'0')+' até o fim do expediente';
  $('#daybar-info').innerHTML=`<span>${s.workStart}</span><span style="font-weight:700;color:var(--text)">${msg}</span><span>${s.workEnd}</span>`;
}

function tagPickerHtml(selected){
  return DATA.tags.map(t=>`<span class="chip" data-tag="${t.id}" style="background:${selected.includes(t.id)?t.color:'#c9ccd4'};cursor:pointer" onclick="this.dataset.on=this.dataset.on==='1'?'0':'1';this.style.background=this.dataset.on==='1'?'${t.color}':'#c9ccd4'" data-on="${selected.includes(t.id)?'1':'0'}">${esc(t.name)}</span>`).join('')
  +` <button class="btn small" type="button" onclick="tagManager()">＋ gerenciar</button>`;
}
function collectTags(){return [...document.querySelectorAll('#pf-tags .chip')].filter(c=>c.dataset.on==='1').map(c=>c.dataset.tag);}
function saveProc(id){
  let tipo=$('#pf-tipo').value;
  if(tipo==='__novo'){
    tipo=$('#pf-tipo-novo').value.trim();
    if(!tipo){alert('Digite o nome do novo tipo.');return;}
    if(!DATA.procTypes.includes(tipo))DATA.procTypes.push(tipo);
  }
  const rec={
    numero:$('#pf-num').value.trim(),tipo,
    tribunal:$('#pf-tribunal').value.trim(),
    assunto:$('#pf-assunto').value.trim(),
    distribuicao:$('#pf-dist').value||null,
    poloAtivo:$('#pf-ativo').value.trim(),poloPassivo:$('#pf-passivo').value.trim(),
    juizo:$('#pf-juizo').value.trim(),clientId:$('#pf-cli').value||null,
    valor:$('#pf-valor').value.trim(),obs:$('#pf-obs').value.trim(),tags:collectTags()
  };
  if(!rec.numero&&!rec.poloAtivo){alert('Informe ao menos o número do processo ou o polo ativo.');return;}
  if(id){Object.assign(getProc(id),rec);}
  else{DATA.processes.push({id:uid(),movs:[],desdobras:[],linked:[],lastSync:null,...rec});}
  save();closeModal();render();
}
function delProc(id){
  if(!confirmDel('Excluir este processo e todos os seus desdobramentos?'))return;
  DATA.processes=DATA.processes.filter(p=>p.id!==id);
  DATA.tasks.forEach(t=>{if(t.processId===id)t.processId=null;});
  save();closeModal();nav('procs');
}

/* --- gerenciador de etiquetas --- */
function tagManager(){
  openModal('Etiquetas de áreas',`
    <div id="tag-list">${DATA.tags.map(t=>`
      <div class="row" style="margin-bottom:8px">
        <input type="color" value="${t.color}" style="width:44px;padding:2px;height:36px" onchange="updTag('${t.id}','color',this.value)">
        <input value="${esc(t.name)}" onchange="updTag('${t.id}','name',this.value)">
        <button class="btn icon danger" onclick="delTag('${t.id}')">🗑</button>
      </div>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      <input type="color" id="nt-color" value="#5b5bd6" style="width:44px;padding:2px;height:36px">
      <input id="nt-name" placeholder="Nova etiqueta (ex.: Previdenciário)">
      <button class="btn primary" onclick="addTag()">Adicionar</button>
    </div>
  `,`<button class="btn primary" onclick="closeModal();render()">Concluir</button>`);
}
function updTag(id,k,v){const t=getTag(id);if(t){t[k]=v;save();}}
function delTag(id){
  if(!confirmDel('Excluir esta etiqueta? Ela será removida dos processos.'))return;
  DATA.tags=DATA.tags.filter(t=>t.id!==id);
  DATA.processes.forEach(p=>{p.tags=(p.tags||[]).filter(x=>x!==id);});
  save();tagManager();
}
function addTag(){
  const n=$('#nt-name').value.trim();if(!n)return;
  DATA.tags.push({id:uid(),name:n,color:$('#nt-color').value});
  save();tagManager();
}

function movListHtml(movs,procId,scope){
  if(!movs||!movs.length)return'<div class="empty">Nenhuma movimentação registrada.</div>';
  return [...movs].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`
    <div class="mov"><div class="mov-acts">
        <button class="btn small" onclick="movForm('${procId}','${scope}','${m.id}')">✎</button>
        <button class="btn small danger" onclick="delMov('${procId}','${scope}','${m.id}')">✕</button></div>
      <div class="mov-h"><b>${esc(m.tipo)}</b><span class="mov-date">${fmtD(m.date)}</span></div>
      ${m.desc?`<div class="mov-desc">${esc(m.desc)}</div>`:''}
    </div>`).join('');
}
function movScopeObj(procId,scope){
  const p=getProc(procId);if(!p)return null;
  if(scope==='main')return p;
  return (p.desdobras||[]).find(d=>d.id===scope);
}
function movForm(procId,scope,movId){
  const holder=movScopeObj(procId,scope);
  const m=movId?holder.movs.find(x=>x.id===movId):null;
  openModal(m?'Editar movimentação':'Nova movimentação',`
    <div class="grid2">
      <div class="field"><label>Data</label><input type="date" id="mf-date" value="${m?.date||todayStr()}"></div>
      <div class="field"><label>Tipo de movimento</label>
        <select id="mf-tipo">${DATA.movTypes.map(t=>`<option ${m?.tipo===t?'selected':''}>${esc(t)}</option>`).join('')}<option value="__novo">➕ Outro (digitar)…</option></select>
      </div>
    </div>
    <div class="field" id="mf-tipo-novo-wrap" style="display:none"><label>Nome do novo tipo</label><input id="mf-tipo-novo"></div>
    <div class="field"><label>Descrição livre</label><textarea id="mf-desc" placeholder="Detalhes do andamento…">${esc(m?.desc||'')}</textarea></div>
  `,`
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn primary" onclick="saveMov('${procId}','${scope}','${movId||''}')">Salvar</button>
  `);
  $('#mf-tipo').addEventListener('change',e=>{$('#mf-tipo-novo-wrap').style.display=e.target.value==='__novo'?'block':'none';});
  if(m&&!DATA.movTypes.includes(m.tipo)){
    $('#mf-tipo').value='__novo';$('#mf-tipo-novo-wrap').style.display='block';$('#mf-tipo-novo').value=m.tipo;
  }
}
function saveMov(procId,scope,movId){
  const holder=movScopeObj(procId,scope);if(!holder)return;
  let tipo=$('#mf-tipo').value;
  if(tipo==='__novo'){
    tipo=$('#mf-tipo-novo').value.trim();
    if(!tipo){alert('Digite o tipo do movimento.');return;}
    if(!DATA.movTypes.includes(tipo))DATA.movTypes.push(tipo);
  }
  const rec={date:$('#mf-date').value||todayStr(),tipo,desc:$('#mf-desc').value.trim()};
  if(movId){Object.assign(holder.movs.find(x=>x.id===movId),rec);}
  else{holder.movs.push({id:uid(),...rec});}
  save();closeModal();render();
}
function delMov(procId,scope,movId){
  if(!confirmDel('Excluir esta movimentação?'))return;
  const holder=movScopeObj(procId,scope);
  holder.movs=holder.movs.filter(m=>m.id!==movId);
  save();render();
}
function desdobraForm(procId,dId){
  const p=getProc(procId);
  const d=dId?(p.desdobras||[]).find(x=>x.id===dId):null;
  const kinds=['Recurso de Apelação','Agravo de Instrumento','Embargos de Declaração','Recurso Especial','Recurso Extraordinário','Recurso Ordinário','Cumprimento de Sentença','Incidente de Desconsideração','Impugnação','Outro'];
  openModal(d?'Editar desdobramento':'Novo desdobramento',`
    <div class="field"><label>Tipo</label>
      <select id="df-tipo">${kinds.map(k=>`<option ${d?.tipo===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="field" id="df-outro-wrap" style="display:${d&&!kinds.includes(d.tipo)?'block':'none'}"><label>Descreva</label><input id="df-outro" value="${d&&!kinds.includes(d.tipo)?esc(d.tipo):''}"></div>
    <div class="field"><label>Número (se houver)</label><input id="df-num" value="${esc(d?.numero||'')}"></div>
  `,`
    ${d?`<button class="btn danger" onclick="delDesdobra('${procId}','${dId}')">Excluir</button><span style="flex:1"></span>`:''}
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn primary" onclick="saveDesdobra('${procId}','${dId||''}')">Salvar</button>
  `);
  if(d&&!kinds.includes(d.tipo))$('#df-tipo').value='Outro';
  $('#df-tipo').addEventListener('change',e=>{$('#df-outro-wrap').style.display=e.target.value==='Outro'?'block':'none';});
}
function saveDesdobra(procId,dId){
  const p=getProc(procId);
  let tipo=$('#df-tipo').value;
  if(tipo==='Outro'){tipo=$('#df-outro').value.trim()||'Outro';}
  const rec={tipo,numero:$('#df-num').value.trim()};
  if(dId){Object.assign(p.desdobras.find(x=>x.id===dId),rec);}
  else{p.desdobras=p.desdobras||[];p.desdobras.push({id:uid(),movs:[],...rec});}
  save();closeModal();render();
}
function delDesdobra(procId,dId){
  if(!confirmDel('Excluir este desdobramento e suas movimentações?'))return;
  const p=getProc(procId);
  p.desdobras=p.desdobras.filter(d=>d.id!==dId);
  save();closeModal();render();
}
function linkForm(procId){
  openModal('Vincular processo',`
    <div class="field"><label>Processo já cadastrado</label>
      <select id="lf-proc"><option value="">— ou informe manualmente abaixo —</option>
      ${DATA.processes.filter(x=>x.id!==procId).map(x=>`<option value="${x.id}">${esc(x.numero||x.tipo)}</option>`).join('')}</select></div>
    <div class="field"><label>Número (se não cadastrado)</label><input id="lf-num" placeholder="Número do processo externo"></div>
    <div class="field"><label>Relação</label><input id="lf-rel" placeholder="Ex.: Embargos de terceiro, ação conexa…"></div>
  `,`
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn primary" onclick="saveLink('${procId}')">Vincular</button>
  `);
}
function saveLink(procId){
  const p=getProc(procId);
  p.linked=p.linked||[];
  p.linked.push({id:uid(),procId:$('#lf-proc').value||null,numero:$('#lf-num').value.trim(),rel:$('#lf-rel').value.trim()});
  save();closeModal();render();
}
function unlink(procId,lid){
  const p=getProc(procId);
  p.linked=p.linked.filter(l=>l.id!==lid);
  save();render();
}

function delClient(id){

function addFolder(cid){
  const c=getClient(cid);const n=$('#nf-name').value.trim();if(!n)return;
  if(!c.folders.includes(n))c.folders.push(n);
  save();render();
}
function delFolder(cid,f){
  const c=getClient(cid);
  const has=c.files.some(x=>x.folder===f);
  if(has&&!confirmDel('A pasta contém arquivos, que também serão excluídos. Continuar?'))return;
  c.files.filter(x=>x.folder===f).forEach(x=>fileDel(x.id));
  c.files=c.files.filter(x=>x.folder!==f);
  c.folders=c.folders.filter(x=>x!==f);
  save();render();
}
function uploadFiles(cid,folder,input){
  const c=getClient(cid);
  const files=[...input.files];
  let pend=files.length;
  files.forEach(f=>{
    if(f.size>15*1024*1024){alert(f.name+': arquivo acima de 15 MB — muito grande para guardar no navegador.');if(--pend===0)render();return;}
    const rd=new FileReader();
    rd.onload=async()=>{
      const id=uid();
      await idbReady;
      await fileAdd({id,data:rd.result,name:f.name,type:f.type});
      c.files.push({id,folder,name:f.name,size:f.size,date:todayStr()});
      save();
      if(--pend===0)render();
    };
    rd.readAsDataURL(f);
  });
}
async function downloadFile(id){
  await idbReady;
  const rec=await fileGet(id);
  if(!rec){alert('Arquivo não encontrado neste navegador.');return;}
  const a=document.createElement('a');a.href=rec.data;a.download=rec.name;a.click();
}
function removeFile(cid,id){
  if(!confirmDel('Excluir este arquivo?'))return;
  const c=getClient(cid);
  c.files=c.files.filter(x=>x.id!==id);
  fileDel(id);save();render();
}

function saveHist(cid,kind,hid){

let taskView='list'; // 'list' | 'kanban'
function renderTasks(v){
  v.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div class="row" style="gap:6px">
      <button class="btn${taskView==='list'?' primary':''}" onclick="taskView='list';renderTasks($('#view'))">≡ Lista</button>

  </div>
  <div id="tasks-inner"></div>`;
  if(taskView==='kanban')renderKanban($('#tasks-inner'));
  else renderTaskList($('#tasks-inner'));
}
function renderTaskList(v){
  if(!v)return;
  const statuses=(DATA.settings.taskStatuses||['A Fazer','Em Andamento','Aguardando','Concluído']);
  const pend=DATA.tasks.filter(t=>!t.done).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const done=DATA.tasks.filter(t=>t.done).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const row=t=>{
    const proc=t.processId?getProc(t.processId):null;
    const cli=t.clientId?getClient(t.clientId):(proc?getClient(proc.clientId):null);
    const totalSecs=(t.timeEntries||[]).reduce((s,e)=>s+(e.dur||0),0);
    return `<tr class="click" onclick="openTaskDetail('${t.id}')">
      <td style="width:36px"><input type="checkbox" ${t.done?'checked':''} onclick="event.stopPropagation();toggleTask('${t.id}')"></td>
      <td>${t.isPrazo?'<b style="color:var(--red);font-size:10.5px">PRAZO</b> ':''}<b>${esc(t.title)}</b>
        <br><span class="muted" style="font-size:11px">${t.status||statuses[0]}${totalSecs?' · ⏱ '+fmtDuration(totalSecs):''}</span></td>
      <td>${t.date?fmtD(t.date):'—'}</td>
      <td>${cli?esc(clientLabel(cli)):'—'}</td>
      <td>${proc?esc(proc.numero||proc.tipo):'—'}</td></tr>`;
  };
  v.innerHTML=`
  <div class="card"><div class="card-h">Pendentes (${pend.length})</div>
    <table class="tbl"><thead><tr><th></th><th>Tarefa</th><th>Data</th><th>Cliente</th><th>Processo</th></tr></thead>
    <tbody>${pend.map(row).join('')||'<tr><td colspan="5" class="empty">Nenhuma tarefa pendente 🎉</td></tr>'}</tbody></table></div>
  <div class="card" style="margin-top:16px"><div class="card-h">Concluídas (${done.length})</div>
    <table class="tbl" style="opacity:.65"><tbody>${done.slice(0,30).map(row).join('')||'<tr><td class="empty">Nada concluído ainda.</td></tr>'}</tbody></table></div>`;
}
function renderKanban(v){
  if(!v)return;
  const statuses=(DATA.settings.taskStatuses||['A Fazer','Em Andamento','Aguardando','Concluído']);
  const cols=statuses.map(st=>{
    const tasks=DATA.tasks.filter(t=>!t.done&&(t.status||statuses[0])===st);
    const doneCol=st==='Concluído'?DATA.tasks.filter(t=>t.done):[];
    const all=[...tasks,...doneCol];
    return `<div class="k-col" data-status="${esc(st)}"
        ondragover="event.preventDefault();this.classList.add('dragover-col')"
        ondragleave="this.classList.remove('dragover-col')"
        ondrop="kanbanDrop(event,'${esc(st)}')">
      <div class="k-col-h">${esc(st)}<span style="background:var(--border);border-radius:10px;padding:1px 7px;font-size:10px;color:var(--muted)">${all.length}</span></div>
      <div class="k-col-body">${all.map(t=>{
        const proc=t.processId?getProc(t.processId):null;
        const cli=t.clientId?getClient(t.clientId):(proc?getClient(proc.clientId):null);
        return `<div class="k-card${t.isPrazo?' prazo':''}${t.done?' done':''}" draggable="true"
            ondragstart="taskDragStart(event,'${t.id}')" onclick="openTaskDetail('${t.id}')">
          <div style="font-size:12.5px;font-weight:600">${t.isPrazo?'<b style="color:var(--red);font-size:9.5px">PRAZO </b>':''}${esc(t.title)}</div>
          ${t.date?`<div style="font-size:10.5px;color:var(--muted);margin-top:2px">${fmtD(t.date)}</div>`:''}
          ${cli?`<div style="font-size:10.5px;color:var(--muted)">${esc(clientLabel(cli))}</div>`:''}
        </div>`;
      }).join('')||'<div class="empty" style="font-size:11.5px">Sem tarefas</div>'}</div>
    </div>`;
  });
  v.innerHTML=`<div class="kanban-wrap">${cols.join('')}</div>`;
}
function kanbanDrop(e,status){
  e.preventDefault();e.currentTarget.classList.remove('dragover-col');
  const id=e.dataTransfer.getData('text/plain');
  const t=DATA.tasks.find(x=>x.id===id);
  if(t){
    const statuses=(DATA.settings.taskStatuses||['A Fazer','Em Andamento','Aguardando','Concluído']);
    t.status=status;
    t.done=(status==='Concluído');
    save();renderKanban($('#tasks-inner'));
  }
}

function saveTask(id){

let agendaDate=new Date();
function renderAgenda(v){
  const y=agendaDate.getFullYear(),m=agendaDate.getMonth();
  const first=new Date(y,m,1);
  const gridStart=new Date(first);gridStart.setDate(1-first.getDay());
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart);d.setDate(d.getDate()+i);
    const ds=dstr(d);
    const inMonth=d.getMonth()===m;
    const tasks=DATA.tasks.filter(t=>t.date===ds);
    cells+=`<div class="mg-cell${inMonth?'':' other'}${ds===todayStr()?' todaycell':''}" ondragover="dayDragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="dayDrop(event)" data-date="${ds}">
      <div class="n">${d.getDate()}</div>
      ${tasks.map(t=>`<div class="mg-task${t.isPrazo?' prazo':''}${t.done?' done':''}" draggable="true" ondragstart="taskDragStart(event,'${t.id}')" onclick="taskForm('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>`).join('')}
      <div class="mg-task" style="background:none;color:var(--muted);cursor:pointer" onclick="taskForm(null,'${ds}')">＋</div>
    </div>`;
  }
  v.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div class="row">
      <button class="btn" onclick="agendaDate=new Date(${y},${m-1},1);render()">‹</button>
      <b style="font-size:16px;min-width:170px;text-align:center">${MONTHS[m]} ${y}</b>
      <button class="btn" onclick="agendaDate=new Date(${y},${m+1},1);render()">›</button>
      <button class="btn" onclick="agendaDate=new Date();render()">Hoje</button>
    </div>
    <button class="btn primary" onclick="taskForm()">+ Nova tarefa</button>
  </div>
  <div class="card" style="overflow:hidden">
    <div class="month-grid">
      ${WEEKDAYS.map(w=>`<div class="mg-h">${w}</div>`).join('')}
      ${cells}

function exportBackup(){
  const data={...DATA};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup-jurisflow-'+todayStr()+'.json';
  a.click();
}
function importBackup(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.settings||!Array.isArray(d.clients))throw new Error('formato');
      if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;
      DATA=d;save();location.reload();
    }catch(e){alert('Arquivo de backup inválido.');}
  };
  rd.readAsText(f);
}

function showToast(msg, type, duration){
  const root=$('#toast-root');
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.innerHTML=msg;
  root.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(10px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),320);},(duration||3500));
}
