/** Verifica se o backend está rodando antes de fazer chamadas */
async function checkBackend(){
  try{
    const r=await fetch(`${API_BASE}/api/ping`,{signal:AbortSignal.timeout(4000)});
    return r.ok;
  }catch(e){return false;}
}

/**
 * buscaDataJud()
 * Chamada pelo botão 🔍 no formulário de processo.
 * Consulta o backend → preenche todos os campos automaticamente.
 */
async function buscaDataJud(){
  const numero=($('#pf-num').value||'').trim();
  if(!numero){showToast('⚠️ Informe o número CNJ antes de buscar.','warn');return;}
  const btn=$('#pf-buscar'),status=$('#pf-dj-status');
  btn.disabled=true;btn.innerHTML='<i class="spin">⏳</i> Consultando…';
  status.textContent='';
  const online=await checkBackend();
  if(!online){
    btn.disabled=false;btn.innerHTML='🔍 Buscar no DataJud';
    status.innerHTML='<b style="color:var(--red)">Backend não encontrado.</b> Abra o arquivo <b>iniciar-backend.bat</b> primeiro, depois tente novamente.';
    return;
  }
  try{
    const r=await fetch(`${API_BASE}/api/processo/${encodeURIComponent(numero)}`);
    const data=await r.json();
    if(!r.ok)throw new Error(data.erro||`Erro ${r.status}`);
    preencherFormularioComDJ(data);
    status.innerHTML=`<span style="color:var(--green)">✔ Dados preenchidos automaticamente com base no DataJud.</span>`;
    showToast('✔ Processo encontrado e preenchido!','success');
  }catch(e){
    status.innerHTML=`<span style="color:var(--red)">✘ ${esc(e.message)}</span>`;
    showToast('✘ '+e.message,'error');
  }finally{btn.disabled=false;btn.innerHTML='🔍 Buscar no DataJud';}
}

/** Preenche os campos do formulário com os dados vindos do backend */
function preencherFormularioComDJ(d){
  if(d.numero)$('#pf-num').value=d.numero;
  if(d.tribunal)$('#pf-tribunal').value=d.tribunal;
  if(d.orgaoJulgador)$('#pf-juizo').value=d.orgaoJulgador+(d.municipio?' — '+d.municipio:'');
  if(d.valorCausa)$('#pf-valor').value=d.valorCausa;
  if(d.distribuicao)$('#pf-dist').value=d.distribuicao;
  if(d.assunto)$('#pf-assunto').value=d.assunto;
  // Polo ativo = primeiro "Ativo", polo passivo = primeiro "Passivo"
  const ativo=(d.partes||[]).find(p=>p.tipo==='Ativo');
  const passivo=(d.partes||[]).find(p=>p.tipo==='Passivo');
  if(ativo&&!$('#pf-ativo').value)$('#pf-ativo').value=ativo.nome;
  if(passivo&&!$('#pf-passivo').value)$('#pf-passivo').value=passivo.nome;
  // Infere tipo pelo campo "classe" da API
  if(d.classe){
    const low=d.classe.toLowerCase();
    let tipoMatch=DATA.procTypes.find(t=>low.includes(t.toLowerCase()));
    if(!tipoMatch){
      DATA.procTypes.push(d.classe);
      tipoMatch=d.classe;
    }
    const sel=$('#pf-tipo');
    if(sel){[...sel.options].forEach(o=>{if(o.value===tipoMatch||o.text===tipoMatch)o.selected=true;});}
  }
  // Observações: lista de partes completa
  const partesTexto=(d.partes||[]).map(p=>`${p.tipo}: ${p.nome}`).join('\n');
  if(partesTexto&&!$('#pf-obs').value)$('#pf-obs').value=partesTexto;
}

/**
 * sincronizarMovimentacoes(procId, showAlert)
 * Consulta o DataJud, importa movimentações novas e descarta duplicadas.
 * showAlert=true → mostra toast/resultado ao usuário
 * showAlert=false → silencioso (usado no auto-sync de 24h)
 */
async function sincronizarMovimentacoes(procId, showAlert){
  const p=getProc(procId);
  if(!p||!p.numero)return;
  const btnId='btn-sync-'+procId;
  const btn=$(('#'+btnId));
  if(btn){btn.disabled=true;btn.innerHTML='<i class="spin">⏳</i> Atualizando…';}
  if(showAlert)showToast('<i class="spin">⏳</i> Consultando DataJud…');
  const online=await checkBackend();
  if(!online){
    if(btn){btn.disabled=false;btn.innerHTML='🔄 Atualizar Processo';}
    if(showAlert)showToast('Backend não encontrado. Abra o iniciar-backend.bat.','error');
    return;
  }
  try{
    const r=await fetch(`${API_BASE}/api/processo/${encodeURIComponent(p.numero)}`);
    const data=await r.json();
    if(!r.ok)throw new Error(data.erro||`Erro ${r.status}`);
    const novas=importarMovimentacoes(p,data.movimentos||[]);
    // Atualiza campos que podem ter mudado (vara, valor…)
    if(data.orgaoJulgador&&!p.juizo)p.juizo=data.orgaoJulgador+(data.municipio?' — '+data.municipio:'');
    if(data.valorCausa&&!p.valor)p.valor=data.valorCausa;
    if(data.tribunal&&!p.tribunal)p.tribunal=data.tribunal;
    if(data.assunto&&!p.assunto)p.assunto=data.assunto;
    if(data.distribuicao&&!p.distribuicao)p.distribuicao=data.distribuicao;
    p.lastSync=new Date().toISOString();
    save();
    if(showAlert){
      if(novas>0){showToast(`✔ ${novas} nova${novas>1?'s':''} movimentaç${novas>1?'ões':'ão'} importada${novas>1?'s':''}!`,'success');}
      else{showToast('Processo já está atualizado — nenhuma novidade no DataJud.','');}
    }
    if(route.page==='proc'&&route.id===procId)render();
  }catch(e){
    if(showAlert)showToast('✘ '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='🔄 Atualizar Processo';}
  }
}

/**
 * importarMovimentacoes(p, movsDataJud)
 * Adiciona somente movimentações novas (sem duplicar).
 * Chave de deduplicação: data + tipo (normalizado).
 * Retorna quantidade de novas importadas.
 */
function importarMovimentacoes(p, movsDataJud){
  const existentes=new Set(
    (p.movs||[]).map(m=>(m.date||'')+'|'+(m.tipo||'').trim().toLowerCase())
  );
  let novas=0;
  // Ordena cronologicamente (mais antigas primeiro)
  const sorted=[...movsDataJud].filter(m=>m.date).sort((a,b)=>a.date.localeCompare(b.date));
  for(const m of sorted){
    const key=(m.date||'')+'|'+(m.tipo||'').trim().toLowerCase();
    if(!existentes.has(key)){
      p.movs.push({id:uid(),date:m.date,tipo:m.tipo||'Movimento',desc:m.desc||''});
      existentes.add(key);
      novas++;
    }
  }
  return novas;
}

/**
 * atualizarTodos()
 * Percorre todos os processos com número CNJ e sincroniza um por um.
 * Exibe progresso em modal.
 */
async function atualizarTodos(){
  const alvo=DATA.processes.filter(p=>p.numero);
  if(!alvo.length){showToast('Nenhum processo com número CNJ cadastrado.','warn');return;}
  const online=await checkBackend();
  if(!online){showToast('Backend não encontrado. Abra o iniciar-backend.bat primeiro.','error');return;}
  let ok=0,novos=0,erros=0,atual=0;
  openModal('🔄 Atualizar todos os processos',`
    <div id="lote-prog" style="text-align:center;padding:12px">
      <div style="font-size:14px;margin-bottom:8px">Atualizando <b>${alvo.length}</b> processo(s)…</div>
      <div id="lote-bar-wrap" style="background:var(--bg);border-radius:8px;height:12px;overflow:hidden"><div id="lote-bar" style="width:0%;height:100%;background:var(--accent);transition:width .3s"></div></div>
      <div id="lote-txt" class="muted" style="font-size:12px;margin-top:6px">Aguarde…</div>
    </div>`,'');
  for(const p of alvo){
    atual++;
    const pct=Math.round((atual/alvo.length)*100);
    const barEl=$('#lote-bar');const txtEl=$('#lote-txt');
    if(barEl)barEl.style.width=pct+'%';
    if(txtEl)txtEl.textContent=`(${atual}/${alvo.length}) ${p.numero||p.tipo}`;
    try{
      const r=await fetch(`${API_BASE}/api/processo/${encodeURIComponent(p.numero)}`);
      const data=await r.json();
      if(!r.ok)throw new Error(data.erro||`Erro ${r.status}`);
      const qtd=importarMovimentacoes(p,data.movimentos||[]);
      if(data.tribunal&&!p.tribunal)p.tribunal=data.tribunal;
      if(data.assunto&&!p.assunto)p.assunto=data.assunto;
      if(data.valorCausa&&!p.valor)p.valor=data.valorCausa;
      if(data.distribuicao&&!p.distribuicao)p.distribuicao=data.distribuicao;
      if(data.orgaoJulgador&&!p.juizo)p.juizo=data.orgaoJulgador;
      p.lastSync=new Date().toISOString();
      novos+=qtd;ok++;
    }catch(e){erros++;}
    save();
    // Pequena pausa entre requisições para não sobrecarregar o DataJud
    await new Promise(res=>setTimeout(res,400));
  }
  const progEl=$('#lote-prog');
  if(progEl)progEl.innerHTML=`<div style="font-size:14px;font-weight:700;margin-bottom:8px">Concluído!</div>
    <div class="muted" style="font-size:13px">${ok} processo(s) consultado(s) · <b>${novos}</b> nova(s) movimentação(ões) importada(s) · ${erros} erro(s)</div>`;
  save();render();
}

/**
 * Auto-sync: ao abrir um processo, verifica se faz mais de 24h
 * desde a última sincronização e consulta silenciosamente.
 */
function deveAutoSync(p){
  if(!p.numero)return false;
  if(!p.lastSync)return true;
  const horas=(Date.now()-new Date(p.lastSync).getTime())/3600000;
  return horas>=24;
}

/* ══════════════════════════════════════════════════════════════════════════
   SALAS DE VOZ EMBUTIDAS — WebRTC + Socket.IO
   O áudio vai peer-to-peer (STUN); o servidor só faz sinalização.
   Funciona apenas quando o backend está rodando em http://localhost:3000
   ══════════════════════════════════════════════════════════════════════════ */

function initVoice(){
  if(window._voiceInitDone||window._voiceScriptLoading)return;
  window._voiceScriptLoading=true;
  const s=document.createElement('script');
  s.src=`${API_BASE}/socket.io/socket.io.js`;
  s.onload=()=>{
    window._voiceInitDone=true;
    connectVoiceSocket();
  };
  s.onerror=()=>{
    window._voiceScriptLoading=false; // allow retry next time
    renderVoiceSidebar();
  };
  document.head.appendChild(s);
}

function connectVoiceSocket(){
  if(voiceSocket?.connected)return;
  // io() is provided by socket.io.js loaded above
  voiceSocket=window.io(API_BASE,{transports:['websocket','polling'],reconnectionDelay:3000});

  voiceSocket.on('connect',()=>{
    voiceSocket.emit('get-rooms-info');
    renderVoiceSidebar();
  });

  voiceSocket.on('disconnect',()=>{
    _voiceCleanup();
    renderVoiceSidebar();
  });

  voiceSocket.on('rooms-info',info=>{
    roomsInfo=info||{};
    renderVoiceSidebar();
  });

  voiceSocket.on('room-update',({roomId,participants})=>{
    if(!roomsInfo[roomId])roomsInfo[roomId]={};
    roomsInfo[roomId].participants=participants;
    roomsInfo[roomId].count=Object.keys(participants).length;
    renderVoiceSidebar();
  });

  voiceSocket.on('room-joined',async({roomId,peers,participants})=>{
    connectedRoomId=roomId;
    roomsInfo[roomId]={participants:participants||{},count:Object.keys(participants||{}).length};
    // Para cada peer já na sala, nós (recém-chegado) criamos a oferta
    for(const peerId of (peers||[])){
      const pc=_createPeerConn(peerId);
      const offer=await pc.createOffer();
      await pc.setLocalDescription(offer);
      voiceSocket.emit('signal',{to:peerId,data:{type:'offer',sdp:offer.sdp}});
    }
    renderVoiceSidebar();
  });

  voiceSocket.on('signal',async({from,data})=>{
    let pc=voicePeers[from];
    if(data.type==='offer'){
      if(!pc)pc=_createPeerConn(from);
      await pc.setRemoteDescription({type:'offer',sdp:data.sdp});
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      voiceSocket.emit('signal',{to:from,data:{type:'answer',sdp:answer.sdp}});
    }else if(data.type==='answer'){
      if(pc)await pc.setRemoteDescription({type:'answer',sdp:data.sdp}).catch(()=>{});
    }else if(data.candidate){
      if(pc)pc.addIceCandidate(data.candidate).catch(()=>{});
    }
  });

  voiceSocket.on('peer-left',peerId=>{
    if(voicePeers[peerId]){voicePeers[peerId].close();delete voicePeers[peerId];}
    const el=document.getElementById(`vs-audio-${peerId}`);if(el)el.remove();
    renderVoiceSidebar();
  });
}

function _createPeerConn(peerId){
  const pc=new RTCPeerConnection({iceServers:STUN_SERVERS});
  voicePeers[peerId]=pc;
  // Adiciona trilhas do mic local
  if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  // Envia candidatos ICE
  pc.onicecandidate=({candidate})=>{
    if(candidate&&voiceSocket)voiceSocket.emit('signal',{to:peerId,data:{candidate}});
  };
  // Reproduz áudio remoto
  pc.ontrack=({streams})=>{
    const stream=streams&&streams[0];if(!stream)return;
    let audio=document.getElementById(`vs-audio-${peerId}`);
    if(!audio){audio=document.createElement('audio');audio.id=`vs-audio-${peerId}`;audio.autoplay=true;document.body.appendChild(audio);}
    audio.srcObject=stream;
    audio.muted=!audioOn;
  };
  return pc;
}

function _voiceCleanup(){
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  Object.values(voicePeers).forEach(pc=>pc.close());
  voicePeers={};
  document.querySelectorAll('[id^="vs-audio-"]').forEach(el=>el.remove());
  connectedRoomId=null;
}

async function joinVoiceRoom(roomId){
  // Segundo clique na sala conectada = sair
  if(connectedRoomId===roomId){leaveVoiceRoom();return;}

  if(!voiceSocket?.connected){
    showToast('⚡ Backend offline. Abra iniciar-backend.bat primeiro e acesse http://localhost:3000','warn',6000);
    return;
  }

  // Pede permissão do microfone
  try{
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    micOn=true;audioOn=true;
  }catch(e){
    showToast('🎙 Permissão de microfone negada. Clique no cadeado na barra do navegador e permita o microfone.','error',6000);
    return;
  }

  // Sai de sala anterior se estiver em uma
  if(connectedRoomId)leaveVoiceRoom(false);

  const name=DATA.settings.userName||DATA.settings.officeName||'Usuário';
  voiceSocket.emit('join-room',{roomId,name});
  if(DATA.myStatus?.code==='away')setMyStatus('online');
}

function leaveVoiceRoom(repaint=true){
  if(!connectedRoomId)return;
  voiceSocket?.emit('leave-room');
  _voiceCleanup();
  if(repaint)renderVoiceSidebar();
}

function toggleVoiceMic(){
  micOn=!micOn;
  if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  voiceSocket?.emit('update-status',{muted:!micOn,deafened:!audioOn});
  renderVoiceSidebar();
}

function toggleVoiceAudio(){
  audioOn=!audioOn;
  document.querySelectorAll('[id^="vs-audio-"]').forEach(el=>{el.muted=!audioOn;});
  voiceSocket?.emit('update-status',{muted:!micOn,deafened:!audioOn});
  renderVoiceSidebar();
}

function renderVoiceSidebar(){
  const el=document.getElementById('voice-sidebar');
  if(!el)return;

  const online=!!(window._voiceInitDone&&voiceSocket?.connected);

  if(!window._voiceInitDone){
    el.innerHTML=`<div class="vs-section-title">🔊 Salas de Voz</div>
      <div class="vs-offline">Acesse via<br><b>http://localhost:3000</b><br>para usar as salas</div>`;
    return;
  }
  if(!online){
    el.innerHTML=`<div class="vs-section-title">🔊 Salas de Voz</div>
      <div class="vs-offline">⚡ Reconectando…</div>`;
    return;
  }

  const rooms=DATA.rooms||[];
  const roomsHtml=rooms.map(r=>{
    const info=roomsInfo[r.id]||{};
    const parts=info.participants||{};
    const cnt=Object.keys(parts).length;
    const isConn=connectedRoomId===r.id;
    let partHtml='';
    if(isConn&&cnt>0){
      partHtml='<div class="vs-participants">'+Object.values(parts).map(p=>`<div class="vs-participant"><span>👤</span>${esc(p.name)}${p.muted?' 🔇':''}${p.deafened?' 🔕':''}</div>`).join('')+'</div>';
    }
    return `<div class="vs-room-item${isConn?' connected':''}" onclick="joinVoiceRoom('${r.id}')">
      <span class="vs-room-emoji">${r.emoji||'💬'}</span>
      <span class="vs-room-name">${esc(r.name)}</span>
      ${cnt?`<span class="vs-room-count">${cnt}</span>`:''}
    </div>${partHtml}`;
  }).join('');

  let ctrlHtml='';
  if(connectedRoomId){
    const room=DATA.rooms.find(r=>r.id===connectedRoomId);
    ctrlHtml=`<div class="vs-controls">
      <span class="vs-ctrl-room">● ${esc(room?.name||'Sala')}</span>
      <button class="vs-ctrl-btn${micOn?'':' off'}" onclick="toggleVoiceMic()" title="${micOn?'Silenciar':'Ativar mic'}">${micOn?'🎙':'🔇'}</button>
      <button class="vs-ctrl-btn${audioOn?'':' off'}" onclick="toggleVoiceAudio()" title="${audioOn?'Desativar áudio':'Ativar áudio'}">${audioOn?'🔊':'🔕'}</button>
      <button class="vs-ctrl-btn off" onclick="leaveVoiceRoom()" title="Sair da sala">🚪</button>
    </div>`;
  }

  el.innerHTML=`<div class="vs-section-title">🔊 Salas de Voz</div>${roomsHtml}${ctrlHtml}`;
}

/* ---------- Início ---------- */
render();
renderTopbarStatus();
initVoice(); // tenta conectar ao backend para as salas de voz
setInterval(()=>{ // vira o dia à meia-noite
  if(route.page==='dash')drawDaybar();
},60000);

</script>
